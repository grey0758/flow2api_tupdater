# Apply after the existing five-slot production and slot1/2 overlays.
# Keep every slot's distinct original validator image as its own build base.
services:
  login-worker-1:
    image: flow2api-token-updater-login-worker:slot1-email-20261004
    pids_limit: 512
    mem_limit: 4g
  login-worker-2:
    image: flow2api-token-updater-login-worker:slot2-email-20261004
    pids_limit: 512
    mem_limit: 4g
  login-worker-3:
    image: flow2api-token-updater-login-worker-core3:auto-five-email-20261004
    pids_limit: 512
    mem_limit: 4g
  login-worker-4:
    image: flow2api-token-updater-login-worker-core4:auto-five-email-20261004
    pids_limit: 512
    mem_limit: 4g
  login-worker-5:
    image: flow2api-token-updater-login-worker-core5:auto-five-email-20261004
    pids_limit: 512
    mem_limit: 4g
