# Apply only with docker-compose.login-slots.yml. Core logical slots 3-5 use
# core3/core4/core5 host sockets, separate from the optional retained slot3.
x-auto-worker: &auto-worker
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
    - seccomp:deploy/login-worker-seccomp.json
  network_mode: none
  mem_limit: 2g
  mem_reservation: 1536m
  pids_limit: 320
  cpus: 2.0
  shm_size: 512m
  healthcheck:
    test: [CMD-SHELL, "test -S /control/worker.sock && kill -0 1"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 30s

x-auto-egress: &auto-egress
  image: flow2api-token-updater-login-worker:${IMAGE_TAG:-local}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "12001:12000"
  mem_limit: 128m
  pids_limit: 64
  cpus: 0.25
  networks: [updater_internal]
  tmpfs:
    - /app/data:ro,nosuid,nodev,noexec,size=64k
    - /app/logs:ro,nosuid,nodev,noexec,size=64k
    - /app/profiles:ro,nosuid,nodev,noexec,size=64k
  healthcheck:
    test: [CMD-SHELL, "test -S /egress/proxy.sock"]
    interval: 5s
    timeout: 2s
    retries: 12
  command: [python, -m, token_updater.login_egress]

services:
  slot-volume-init:
    volumes:
      - login_profile_3:/init/profile3
      - login_profile_4:/init/profile4
      - login_profile_5:/init/profile5
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core3-control:/init/control3
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core4-control:/init/control4
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core5-control:/init/control5
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core3-egress:/init/egress3
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core4-egress:/init/egress4
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core5-egress:/init/egress5
    command:
      - /bin/sh
      - -ec
      - |
        chown 11001:12000 /init/profile1 /init/control1
        chown 11002:12000 /init/profile2 /init/control2
        chown 11004:12000 /init/profile3 /init/control3
        chown 11005:12000 /init/profile4 /init/control4
        chown 11006:12000 /init/profile5 /init/control5
        chown 12001:12000 /init/egress1 /init/egress2 /init/egress3 /init/egress4 /init/egress5
        chmod 0700 /init/profile1 /init/profile2 /init/profile3 /init/profile4 /init/profile5
        chmod 0770 /init/control1 /init/control2 /init/control3 /init/control4 /init/control5 /init/egress1 /init/egress2 /init/egress3 /init/egress4 /init/egress5

  login-egress-3:
    <<: *auto-egress
    container_name: flow-login-egress-core3
    depends_on:
      slot-volume-init: {condition: service_completed_successfully}
    volumes:
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core3-egress:/egress

  login-egress-4:
    <<: *auto-egress
    container_name: flow-login-egress-core4
    depends_on:
      slot-volume-init: {condition: service_completed_successfully}
    volumes:
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core4-egress:/egress

  login-egress-5:
    <<: *auto-egress
    container_name: flow-login-egress-core5
    depends_on:
      slot-volume-init: {condition: service_completed_successfully}
    volumes:
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core5-egress:/egress

  login-worker-3:
    <<: *auto-worker
    image: flow2api-token-updater-login-worker-core3:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.login-worker
      args: {BASE_IMAGE: "flow2api-token-updater-control:${IMAGE_TAG:-local}", WORKER_UID: "11004"}
    container_name: flow-login-worker-core3
    user: "11004:12000"
    depends_on:
      login-egress-3: {condition: service_healthy}
    environment:
      LOGIN_SLOT_NUMBER: "3"
      LOGIN_SLOT_SIGNING_PUBLIC_KEY: ${LOGIN_SLOT_SIGNING_PUBLIC_KEY:?public control key required}
      LOGIN_PROFILE_DIR: /slot/profile
      LOGIN_WORKER_SOCKET: /control/worker.sock
      LOGIN_EGRESS_SOCKET: /egress/proxy.sock
      LOGIN_WORKER_RUNTIME_DIR: /run/flow-login-worker
      LOGIN_EXTENSION_REQUIRED: "1"
      DISPLAY: ":99"
      RESOLUTION: "1365x768x24"
      HOME: /tmp/login-worker-home
      LOG_DIR: /tmp/logs
      FLOW_URL: https://flow.google.com/
      LABS_AUTH_URL: https://labs.google/fx/api/auth/signin?callbackUrl=https%3A%2F%2Flabs.google%2Ffx
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    volumes:
      - login_profile_3:/slot/profile
      - ${LOGIN_SLOT_CORE3_EXTENSION_DIR:-./extensions/core3}:/slot-extension:ro
      - ${YES_CAPTCHA_KEY_FILE:-/opt/flow2api-token-updater-v34/secrets/yescaptcha-client-key}:/run/yescaptcha/client_key:ro
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core3-control:/control
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core3-egress:/egress:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,uid=11004,gid=12000,mode=1770
      - /run:rw,nosuid,nodev,size=16m,uid=11004,gid=12000,mode=0700
      - /app/data:ro,nosuid,nodev,noexec,size=64k
      - /app/logs:ro,nosuid,nodev,noexec,size=64k
      - /app/profiles:ro,nosuid,nodev,noexec,size=64k

  login-worker-4:
    <<: *auto-worker
    image: flow2api-token-updater-login-worker-core4:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.login-worker
      args: {BASE_IMAGE: "flow2api-token-updater-control:${IMAGE_TAG:-local}", WORKER_UID: "11005"}
    container_name: flow-login-worker-core4
    user: "11005:12000"
    depends_on:
      login-egress-4: {condition: service_healthy}
    environment:
      LOGIN_SLOT_NUMBER: "4"
      LOGIN_SLOT_SIGNING_PUBLIC_KEY: ${LOGIN_SLOT_SIGNING_PUBLIC_KEY:?public control key required}
      LOGIN_PROFILE_DIR: /slot/profile
      LOGIN_WORKER_SOCKET: /control/worker.sock
      LOGIN_EGRESS_SOCKET: /egress/proxy.sock
      LOGIN_WORKER_RUNTIME_DIR: /run/flow-login-worker
      LOGIN_EXTENSION_REQUIRED: "1"
      DISPLAY: ":99"
      RESOLUTION: "1365x768x24"
      HOME: /tmp/login-worker-home
      LOG_DIR: /tmp/logs
      FLOW_URL: https://flow.google.com/
      LABS_AUTH_URL: https://labs.google/fx/api/auth/signin?callbackUrl=https%3A%2F%2Flabs.google%2Ffx
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    volumes:
      - login_profile_4:/slot/profile
      - ${LOGIN_SLOT_CORE4_EXTENSION_DIR:-./extensions/core4}:/slot-extension:ro
      - ${YES_CAPTCHA_KEY_FILE:-/opt/flow2api-token-updater-v34/secrets/yescaptcha-client-key}:/run/yescaptcha/client_key:ro
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core4-control:/control
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core4-egress:/egress:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,uid=11005,gid=12000,mode=1770
      - /run:rw,nosuid,nodev,size=16m,uid=11005,gid=12000,mode=0700
      - /app/data:ro,nosuid,nodev,noexec,size=64k
      - /app/logs:ro,nosuid,nodev,noexec,size=64k
      - /app/profiles:ro,nosuid,nodev,noexec,size=64k

  login-worker-5:
    <<: *auto-worker
    image: flow2api-token-updater-login-worker-core5:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile.login-worker
      args: {BASE_IMAGE: "flow2api-token-updater-control:${IMAGE_TAG:-local}", WORKER_UID: "11006"}
    container_name: flow-login-worker-core5
    user: "11006:12000"
    depends_on:
      login-egress-5: {condition: service_healthy}
    environment:
      LOGIN_SLOT_NUMBER: "5"
      LOGIN_SLOT_SIGNING_PUBLIC_KEY: ${LOGIN_SLOT_SIGNING_PUBLIC_KEY:?public control key required}
      LOGIN_PROFILE_DIR: /slot/profile
      LOGIN_WORKER_SOCKET: /control/worker.sock
      LOGIN_EGRESS_SOCKET: /egress/proxy.sock
      LOGIN_WORKER_RUNTIME_DIR: /run/flow-login-worker
      LOGIN_EXTENSION_REQUIRED: "1"
      DISPLAY: ":99"
      RESOLUTION: "1365x768x24"
      HOME: /tmp/login-worker-home
      LOG_DIR: /tmp/logs
      FLOW_URL: https://flow.google.com/
      LABS_AUTH_URL: https://labs.google/fx/api/auth/signin?callbackUrl=https%3A%2F%2Flabs.google%2Ffx
      PLAYWRIGHT_BROWSERS_PATH: /root/.cache/ms-playwright
    volumes:
      - login_profile_5:/slot/profile
      - ${LOGIN_SLOT_CORE5_EXTENSION_DIR:-./extensions/core5}:/slot-extension:ro
      - ${YES_CAPTCHA_KEY_FILE:-/opt/flow2api-token-updater-v34/secrets/yescaptcha-client-key}:/run/yescaptcha/client_key:ro
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core5-control:/control
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core5-egress:/egress:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m,uid=11006,gid=12000,mode=1770
      - /run:rw,nosuid,nodev,size=16m,uid=11006,gid=12000,mode=0700
      - /app/data:ro,nosuid,nodev,noexec,size=64k
      - /app/logs:ro,nosuid,nodev,noexec,size=64k
      - /app/profiles:ro,nosuid,nodev,noexec,size=64k

  token-updater:
    depends_on:
      login-worker-3: {condition: service_healthy}
      login-worker-4: {condition: service_healthy}
      login-worker-5: {condition: service_healthy}
    volumes:
      - login_profile_3:/app/profiles/.login-slots/slot3/profile:ro
      - login_profile_4:/app/profiles/.login-slots/slot4/profile:ro
      - login_profile_5:/app/profiles/.login-slots/slot5/profile:ro
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core3-control:/run/login-slot3
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core4-control:/run/login-slot4
      - ${LOGIN_SLOT_RUNTIME_ROOT:-/run/flow2api-login-slots}/core5-control:/run/login-slot5
    environment:
      LOGIN_SLOT_COUNT: "5"
      LOGIN_SLOT3_UID: "11004"
      LOGIN_SLOT4_UID: "11005"
      LOGIN_SLOT5_UID: "11006"

volumes:
  login_profile_3:
  login_profile_4:
  login_profile_5:
