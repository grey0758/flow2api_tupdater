name: Private image build verification

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  verify-private-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install private verification dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements.txt -r requirements-dev.txt
      - name: Verify repository and topology policy
        run: bash scripts/ci.sh
      - name: Build private control and worker images without publishing
        run: |
          set -euo pipefail
          docker build --tag flow2api-token-updater-control:ci -f Dockerfile .
          docker build \
            --build-arg BASE_IMAGE=flow2api-token-updater-control:ci \
            --tag flow2api-token-updater-login-worker:ci \
            -f Dockerfile.login-worker .
          test "$(docker image inspect -f '{{.Config.User}}' flow2api-token-updater-login-worker:ci)" = "11001:12000"
          test "$(docker image inspect -f '{{json .Config.Volumes}}' flow2api-token-updater-login-worker:ci)" = "null"
          docker image inspect --format '{{.Id}}' flow2api-token-updater-control:ci
          docker image inspect --format '{{.Id}}' flow2api-token-updater-login-worker:ci
      - name: Exercise the release Compose with two isolated RFB sessions
        env:
          IMAGE_TAG: ci
        run: bash scripts/smoke_login_slot_compose.sh

# This workflow never authenticates to a registry or uploads an image.
# Upstream currently has no verifiable license grant; private deployment waits
# for an operator to record the applicable authorization.
