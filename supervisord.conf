[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :99 -screen 0 %(ENV_RESOLUTION)s
autostart=false
autorestart=false
priority=100
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":99"
autostart=false
autorestart=false
priority=200
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:x11vnc]
command=/usr/bin/x11vnc -display :99 -forever -shared -rfbport 5900 -passwd %(ENV_VNC_PASSWORD)s -noxdamage
autostart=false
autorestart=false
priority=300
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5900 --listen %(ENV_NOVNC_PORT)s
autostart=false
autorestart=false
priority=400
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:token_updater]
command=python -m token_updater.main
directory=/app
environment=DISPLAY=":99"
autorestart=true
priority=500
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:slot1-xvfb]
command=/usr/bin/Xvfb :101 -screen 0 %(ENV_RESOLUTION)s
autostart=false
autorestart=false
priority=110

[program:slot1-fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":101"
autostart=false
autorestart=false
priority=210

[program:slot1-x11vnc]
command=/usr/bin/x11vnc -display :101 -forever -shared -localhost -rfbport 5901 -nopw -noxdamage
autostart=false
autorestart=false
priority=310

[program:slot1-novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5901 --listen 127.0.0.1:6081
autostart=false
autorestart=false
priority=410

[program:slot2-xvfb]
command=/usr/bin/Xvfb :102 -screen 0 %(ENV_RESOLUTION)s
autostart=false
autorestart=false
priority=120

[program:slot2-fluxbox]
command=/usr/bin/fluxbox
environment=DISPLAY=":102"
autostart=false
autorestart=false
priority=220

[program:slot2-x11vnc]
command=/usr/bin/x11vnc -display :102 -forever -shared -localhost -rfbport 5902 -nopw -noxdamage
autostart=false
autorestart=false
priority=320

[program:slot2-novnc]
command=/usr/share/novnc/utils/novnc_proxy --vnc localhost:5902 --listen 127.0.0.1:6082
autostart=false
autorestart=false
priority=420
